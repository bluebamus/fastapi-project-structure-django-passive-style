# 품질 게이트 — docs/django-style-app-registry/DJANGO-STYLE-MANUAL-APP-INTEGRATION-PLAN.md
# §5.7 의 AC-13(정적 검사) · AC-14(테스트·커버리지) · AC-09(스키마) 자동화.
#
# 여기 있는 검사는 전부 그 인수 조건을 1:1로 옮긴 것이다. 새 검사를 넣기 전에 §5.7 을
# 먼저 고친다 — CI 가 명세보다 앞서 나가면 "왜 막혔는지" 근거가 사라진다.
#
# 배포·빌드는 다루지 않는다. 이미지 빌드·푸시·릴리스는 별도 인프라 저장소 소관이다
# (design-baseline C-5: 이 저장소는 FastAPI 코드/설정만 담는다).

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# 검수 도구의 stdio 를 UTF-8 로 고정한다 (design-baseline C-7).
#
# 한글 메시지를 담은 리포트를 출력하는 순간 게이트 도구 자체가 인코딩 오류로 죽는
# 일이 실제로 있었다(bandit 이 cp949 콘솔에서 UnicodeEncodeError). 그러면 검사 결과가
# 아니라 크래시가 보이고, 그 크래시 뒤에 진짜 실패가 가려진다.
env:
  PYTHONIOENCODING: utf-8
  PYTHONUTF8: "1"

# 같은 ref 에 연달아 푸시하면 앞선 실행은 취소한다(러너 낭비 방지).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: GATE 3 (charter §3)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: uv 설치
        uses: astral-sh/setup-uv@v5
        with:
          # 패키지 다운로드 캐시. mypy/pytest 결과에는 영향이 없다(아래 주석 참조).
          enable-cache: true
          cache-dependency-glob: uv.lock

      # .python-version(3.14)을 uv 가 읽어 인터프리터를 맞춘다.
      # --frozen: uv.lock 을 그대로 쓰고, 락이 pyproject 와 어긋나면 실패한다(재현성).
      - name: 의존성 설치
        run: uv sync --frozen

      # 검수 도구의 임시 파일·캐시를 **실행별 고유 경로**로 격리한다.
      # 공유 경로를 쓰면 앞선 실행이 남긴 캐시가 이번 결과에 섞여 들어오고, 그 오염은
      # "왜 로컬과 다르지"로만 나타난다. 실행 후 정리까지가 계약이다.
      - name: 검수 임시 경로 격리
        run: |
          gate_tmp="${RUNNER_TEMP}/gate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "${gate_tmp}"
          echo "GATE_TMP=${gate_tmp}" >> "${GITHUB_ENV}"

      # ── 정적 분석 ────────────────────────────────────────────────────────
      - name: ruff (lint)
        run: uv run ruff check .

      - name: ruff (format)
        run: uv run ruff format --check .

      # mypy 캐시는 의도적으로 복원하지 않는다.
      # 따뜻한 캐시의 결과를 게이트 결과로 기록해 3라운드 연속 오기한 적이 있다(ledger LEDGER-1).
      # CI 는 매번 콜드 캐시로 도는 것이 그 사고에 대한 구조적 방어다.
      - name: mypy (콜드 캐시)
        run: uv run mypy --cache-dir "${GATE_TMP}/mypy" .

      # 실질 이슈만 막는다. LOW 는 테스트의 assert·문자열 상수 오탐이 대부분이라 게이트에서 뺀다
      # (AUDIT_REPORT.md §7: LOW 113건 전수 검토 결과 실질 이슈 0건).
      #
      # JSON reporter 를 쓰는 이유: txt reporter 는 리포트를 콘솔 인코딩으로 쓰다가
      # 한글 결과에서 UnicodeEncodeError 로 **죽는다**(F-008). 그러면 "검사 실패"가
      # 아니라 "도구 크래시"가 보이고 진짜 결과가 사라진다. JSON 은 항상 UTF-8 이다.
      #
      # 종료 코드를 직접 판정한다 — reporter 가 죽어도(=결과 파일이 없어도) 게이트가
      # 실패해야 한다. `-q` 만 믿고 넘어가면 리포트 없는 성공이 초록불로 지나간다.
      - name: bandit (MEDIUM 이상)
        run: uv run python -m scripts.bandit_gate

      # ── 테스트 ──────────────────────────────────────────────────────────
      # -rsxX: 건너뛴 테스트를 로그에 드러낸다.
      # charter §3 은 "조용한 SKIP·xfail 0" 을 인수 기준으로 둔다 — 통과 개수만 보고
      # 넘어가면 비활성화된 테스트가 초록불 뒤에 숨는다. 그래서 요약을 직접 판정한다.
      # NFR-08: 프로젝트 전체 85% 이상. 커버리지 임계값이 없으면 "테스트를 안 쓰고
      # 기능을 늘리는" 방향으로 조용히 미끄러진다.
      # 커버리지 데이터·pytest tmp·로그를 실행별 경로로 보낸다. 저장소 루트의
      # `.coverage` 를 쓰면 앞선 실행의 병렬 데이터가 남아 combine 이 형식 충돌로
      # 터진다 — 경로를 격리하면 `rm -f` 로 지우는 습관 자체가 필요 없다.
      - name: pytest (coverage 게이트)
        env:
          COVERAGE_FILE: ${{ env.GATE_TMP }}/.coverage
        run: |
          set -o pipefail
          uv run python -m pytest --cov=app --cov-report=term-missing \
            --cov-fail-under=85 -q -rsxX \
            -m "not mysql and not browser" \
            --basetemp="${GATE_TMP}/pytest" | tee "${GATE_TMP}/pytest.log"

      - name: SKIP·xfail 0건 확인 (charter §3)
        run: |
          # `deselected` 는 세지 않는다 — 이 job 은 인프라 테스트를 **의도적으로**
          # 걸러내므로 성공 실행에도 항상 나타난다. 위반으로 보면 영원히 빨간불이다.
          if grep -qE '[0-9]+ (skipped|xfailed|xpassed)' "${GATE_TMP}/pytest.log"; then
            echo "::error::charter §3 위반 — 조용한 SKIP/xfail 이 있습니다. 요약을 확인하세요."
            grep -E '(skipped|xfailed|xpassed)' "${GATE_TMP}/pytest.log" || true
            exit 1
          fi
          echo "SKIP·xfail 0건"

      # ── 구조 무결성 ──────────────────────────────────────────────────────
      # 마이그레이션 체인은 tests/core/test_migration_chain.py 가 이미 검증한다(INV-5).
      # 여기서는 head 가 갈라지지 않았는지만 본다 — 리비전 병합 실수는 테스트로 안 잡힌다.
      - name: alembic 단일 head
        run: |
          heads=$(uv run alembic heads 2>/dev/null | grep -c '(head)' || true)
          echo "head 개수: ${heads}"
          if [ "${heads}" -ne 1 ]; then
            echo "::error::alembic head 가 ${heads} 개입니다. 단일 head 여야 합니다."
            uv run alembic heads
            exit 1
          fi

      # ── 스키마 드리프트 ──────────────────────────────────────────────────
      # 단일 head 만으로는 "체인은 하나인데 모델과 어긋난 상태" 를 못 잡는다.
      # SQLite 에 실제로 적용한 뒤 autogenerate 가 할 일이 없는지 확인한다(AC-09).
      - name: alembic 적용 + 드리프트 검사
        env:
          ALEMBIC_DATABASE_URL: sqlite:///./ci_schema_check.sqlite3
        run: |
          rm -f ci_schema_check.sqlite3
          uv run alembic upgrade head
          uv run alembic check
          rm -f ci_schema_check.sqlite3

      - name: 검수 임시 경로 정리
        if: always()
        run: rm -rf "${GATE_TMP}"

  # ── MySQL 8.4 통합 (development-plan §10.1 C · ADR-004) ──────────────────
  # 로컬과 **같은** compose.test.yaml 을 쓴다. GitHub Actions 의 services: 블록을
  # 쓰지 않는 이유가 이것이다 — 설정이 두 곳으로 갈리면 "로컬은 되는데 CI 는 안 되는"
  # 상태가 생기고, 그때 어느 쪽이 기준인지 알 수 없다.
  mysql:
    name: MySQL 8.4 통합 (compose.test.yaml)
    runs-on: ubuntu-latest
    # 브라우저 바이너리 설치(--with-deps 는 apt 패키지까지 받는다)가 붙으면서
    # 20분으로는 모자랐다 — 첫 실행이 정확히 20분에 잘렸다. 캐시가 더워지면
    # 다시 짧아지지만, 캐시 미스에서도 통과하는 값으로 둔다.
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4

      - name: uv 설치
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: 의존성 설치
        run: uv sync --frozen

      # --wait 는 healthcheck 가 healthy 를 낼 때까지 블록한다. 이게 없으면
      # 컨테이너 생성 직후 붙어서 첫 테스트가 "Connection refused" 로 깨진다.
      - name: MySQL 기동
        run: docker compose -f compose.test.yaml up -d --wait

      # 빈 DB 에서 시작한다 — migration 체인이 실제로 처음부터 적용되는지 본다.
      - name: alembic upgrade head
        env:
          ALEMBIC_DATABASE_URL: mysql+pymysql://fastapi_passive_test:fastapi_passive_test_password@127.0.0.1:3309/fastapi_passive_test?charset=utf8mb4
        run: uv run alembic upgrade head

      # 최신 revision 을 되돌렸다가 다시 올린다. downgrade 가 깨진 migration 은
      # upgrade 만 돌려서는 절대 드러나지 않는다.
      - name: downgrade -1 → 재-upgrade
        env:
          ALEMBIC_DATABASE_URL: mysql+pymysql://fastapi_passive_test:fastapi_passive_test_password@127.0.0.1:3309/fastapi_passive_test?charset=utf8mb4
        run: |
          uv run alembic downgrade -1
          uv run alembic upgrade head

      - name: 스키마 드리프트 검사
        env:
          ALEMBIC_DATABASE_URL: mysql+pymysql://fastapi_passive_test:fastapi_passive_test_password@127.0.0.1:3309/fastapi_passive_test?charset=utf8mb4
        run: uv run alembic check

      # MySQL 미가용이면 conftest 가 skip 한다. CI 에서의 skip 은 "검증하지 않았다"는
      # 뜻이므로 실패로 취급한다 — 조용한 skip 이 그린으로 보이면 게이트가 무의미하다.
      - name: pytest -m mysql (skip 금지)
        run: |
          uv run python -m pytest -m mysql -q -rsxX | tee mysql.log
          # `deselected` 는 `-m mysql` 이 나머지를 정상적으로 걸러낸 결과다.
          if grep -qE '[0-9]+ skipped' mysql.log; then
            echo "::error::MySQL 통합 테스트가 실행되지 않았습니다(skip). compose 기동을 확인하세요."
            exit 1
          fi
          if grep -q 'no tests ran' mysql.log; then
            echo "::error::mysql 마커가 붙은 테스트가 0건입니다."
            exit 1
          fi

      # Scalar 는 브라우저에서 JavaScript 로 스키마를 그린다. 스키마가 규격에 맞는
      # 것과 화면이 그려지는 것은 다르다 — 그 사이를 여기서 잇는다(ADR-024).
      # 브라우저 바이너리는 매 실행 받을 이유가 없다. playwright 버전이 바뀔 때만
      # 새로 받도록 uv.lock 을 키에 넣는다.
      - name: Chromium 캐시
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('uv.lock') }}

      # 분기하지 않는다. 캐시 히트일 때만 `install-deps` 를 부르도록 나눠봤더니
      # 그 경로에서 35분간 멈췄다(apt 가 무언가를 기다린 것으로 보인다). 캐시 미스로
      # `--with-deps` 를 통째로 돌린 실행은 3분에 끝났다 — 검증된 쪽만 쓴다.
      # 이미 받아둔 바이너리는 playwright 가 다시 내려받지 않는다.
      - name: Chromium 설치
        run: uv run python -m playwright install --with-deps chromium

      - name: pytest -m browser (skip 금지)
        run: |
          uv run python -m pytest -m browser -q -rsxX | tee browser.log
          if grep -qE '[0-9]+ skipped' browser.log; then
            echo "::error::브라우저 테스트가 실행되지 않았습니다(skip)."
            exit 1
          fi
          if grep -q 'no tests ran' browser.log; then
            echo "::error::browser 마커가 붙은 테스트가 0건입니다."
            exit 1
          fi

      - name: 정리
        if: always()
        run: docker compose -f compose.test.yaml down -v
