# 품질 게이트 — 정적 검사 · 테스트/커버리지 · 스키마 정합을 자동화한다.
#
# 판정 규칙의 정본은 `scripts/review_gate.py` 다. 두 곳에 같은 규칙을 손으로 적어 두면
# 반드시 갈린다 — 실제로 `deselected` 를 위반으로 세는 실수를 로컬 게이트에서 고치고
# CI 에 반영하지 않아 한 번 겪었다. 규칙을 바꾸는 사람은 두 파일을 **함께** 본다.
# 같은 규칙: skip·xfail·xpass 금지, `--strict-markers`, 커버리지 측정과 하한(pyproject 의
# `fail_under` 하나 — 기본 0), OpenAPI fail-on-revert. CI 에만 있는 것: alembic 단일 head·SQLite
# 드리프트(로컬에서는 마이그레이션 테스트가 본다).
#
# 배포·빌드는 다루지 않는다. 이미지 빌드·푸시·릴리스는 별도 인프라 저장소 소관이다
# (이 저장소는 FastAPI 코드/설정만 담는다).

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  # 의존성 권고는 코드가 바뀌지 않아도 밖에서 늘어난다. push 가 없는 주에도 pip-audit 이
  # 돌도록 주 1회 실행한다. 월요일 00:00 UTC = 09:00 KST.
  schedule:
    - cron: "0 0 * * 1"

permissions:
  contents: read

# 검수 도구의 stdio 를 UTF-8 로 고정한다.
#
# 한글 메시지를 담은 리포트를 출력하는 순간 게이트 도구 자체가 인코딩 오류로 죽는
# 일이 실제로 있었다(bandit 이 cp949 콘솔에서 UnicodeEncodeError). 그러면 검사 결과가
# 아니라 크래시가 보이고, 그 크래시 뒤에 진짜 실패가 가려진다.
env:
  PYTHONIOENCODING: utf-8
  PYTHONUTF8: "1"
  # CI 에는 .env 가 없다. alembic 등 `config` 를 import 하는 단계는 ENV=test 여야 설정 검증
  # (.env 부재·예시 비밀값)을 건너뛴다. pytest 는 pyproject 의 env 로 이미 ENV=test 다.
  ENV: test

# 같은 ref 에 연달아 푸시하면 앞선 실행은 취소한다(러너 낭비 방지).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: 품질 게이트
    runs-on: ubuntu-24.04  # ubuntu-latest 는 2026-10-19 부터 Ubuntu 26 으로 바뀐다 — 검증 전까지 고정
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: uv 설치
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          # 패키지 다운로드 캐시. mypy/pytest 결과에는 영향이 없다(아래 주석 참조).
          enable-cache: true
          cache-dependency-glob: uv.lock

      # .python-version(3.14)을 uv 가 읽어 인터프리터를 맞춘다.
      # --locked: uv.lock 을 그대로 쓰되, 락이 pyproject 와 어긋나면 실패한다(재현성).
      # (락을 검사하지 않고 설치만 하는 플래그를 쓰면 락 갱신을 잊어도 초록이 된다.)
      - name: 의존성 설치
        run: uv sync --locked

      # 검수 도구의 임시 파일·캐시를 **실행별 고유 경로**로 격리한다.
      # 공유 경로를 쓰면 앞선 실행이 남긴 캐시가 이번 결과에 섞여 들어오고, 그 오염은
      # "왜 로컬과 다르지"로만 나타난다. 실행 후 정리까지가 계약이다.
      - name: 검수 임시 경로 격리
        run: |
          gate_tmp="${RUNNER_TEMP}/gate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "${gate_tmp}"
          echo "GATE_TMP=${gate_tmp}" >> "${GITHUB_ENV}"

      # ── 정적 분석 ────────────────────────────────────────────────────────
      - name: ruff (lint)
        run: uv run ruff check .

      - name: ruff (format)
        run: uv run ruff format --check .

      # mypy 캐시는 의도적으로 복원하지 않는다.
      # 따뜻한 캐시의 결과를 게이트 결과로 기록해 연속으로 오기한 적이 있다.
      # CI 는 매번 콜드 캐시로 도는 것이 그 사고에 대한 구조적 방어다.
      - name: mypy (콜드 캐시)
        run: uv run mypy --cache-dir "${GATE_TMP}/mypy" .

      # 실질 이슈만 막는다. LOW 는 테스트의 assert·문자열 상수 오탐이 대부분이라 게이트에서 뺀다
      # (LOW 는 전수 검토 결과 실질 이슈가 0건이었다).
      #
      # JSON reporter 를 쓰는 이유: txt reporter 는 리포트를 콘솔 인코딩으로 쓰다가
      # 한글 결과에서 UnicodeEncodeError 로 **죽는다**. 그러면 "검사 실패"가
      # 아니라 "도구 크래시"가 보이고 진짜 결과가 사라진다. JSON 은 항상 UTF-8 이다.
      #
      # 종료 코드를 직접 판정한다 — reporter 가 죽어도(=결과 파일이 없어도) 게이트가
      # 실패해야 한다. `-q` 만 믿고 넘어가면 리포트 없는 성공이 초록불로 지나간다.
      - name: bandit (MEDIUM 이상)
        run: uv run python -m scripts.bandit_gate

      # 코드가 한 줄도 안 바뀌어도 의존성 권고는 새로 뜬다. 상향 뒤에 넣어야
      # 의미가 있는 단계다 — 먼저 넣으면 기존 권고 때문에 처음부터 빨갛다.
      # --strict: 감사하지 못한 패키지가 있으면 실패로 본다. "검사 못 했다"가
      # 초록으로 보이면 bandit reporter 크래시와 같은 종류의 거짓말이 된다.
      - name: pip-audit (의존성 권고)
        run: uv run python -m pip_audit --strict --progress-spinner off

      # ── 테스트 ──────────────────────────────────────────────────────────
      # -rsxX: 건너뛴 테스트를 로그에 드러낸다.
      # "조용한 SKIP·xfail 0" 이 인수 기준이다 — 통과 개수만 보고
      # 넘어가면 비활성화된 테스트가 초록불 뒤에 숨는다. 그래서 요약을 직접 판정한다.
      # 커버리지는 항상 측정·출력한다. 하한은 pyproject `fail_under` 하나가 정본이고 기본값은
      # 0(하한 없음 — 사용자 결정). 필요해지면 그 값만 올린다.
      # 커버리지 데이터·pytest tmp·로그를 실행별 경로로 보낸다. 저장소 루트의
      # `.coverage` 를 쓰면 앞선 실행의 병렬 데이터가 남아 combine 이 형식 충돌로
      # 터진다 — 경로를 격리하면 `rm -f` 로 지우는 습관 자체가 필요 없다.
      # Redis 대상을 명시한다 — 이 단계는 Redis 에 붙지 않지만, 앞으로 붙는 테스트가
      # 생겨도 기본 6379(남의 Redis 일 수 있다)로 떨어지지 않게 한다.
      - name: pytest (coverage 게이트)
        env:
          COVERAGE_FILE: ${{ env.GATE_TMP }}/.coverage
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: "6380"
        run: |
          set -o pipefail
          uv run python -m pytest --cov=app --cov-report=term-missing \
            -q -rsxX \
            --basetemp="${GATE_TMP}/pytest" | tee "${GATE_TMP}/pytest.log"

      - name: SKIP·xfail 0건 확인
        run: |
          if grep -qE '[1-9][0-9]* (skipped|xfailed|xpassed)' "${GATE_TMP}/pytest.log"; then
            echo "::error::조용한 SKIP/xfail 이 있습니다. 요약을 확인하세요."
            grep -E '(skipped|xfailed|xpassed)' "${GATE_TMP}/pytest.log" || true
            exit 1
          fi
          echo "SKIP·xfail 0건"

      # 규칙이 실제로 결함을 잡는지 본다 — 통과만으로는 알 수 없다. 소스를 고쳤다 되돌리므로
      # 로컬에서는 락으로 보호하지만, CI 의 체크아웃은 일회용이라 그대로 돌려도 된다.
      - name: OpenAPI 규칙 fail-on-revert
        run: uv run python -m scripts.openapi_revert_check

      # ── 구조 무결성 ──────────────────────────────────────────────────────
      # 마이그레이션 적용·드리프트는 tests/core/test_migrations.py 도 본다.
      # 여기서는 head 가 갈라지지 않았는지만 본다 — 리비전 병합 실수는 테스트로 안 잡힌다.
      - name: alembic 단일 head
        run: |
          heads=$(uv run alembic heads 2>/dev/null | grep -c '(head)' || true)
          echo "head 개수: ${heads}"
          if [ "${heads}" -ne 1 ]; then
            echo "::error::alembic head 가 ${heads} 개입니다. 단일 head 여야 합니다."
            uv run alembic heads
            exit 1
          fi

      # ── 스키마 드리프트 ──────────────────────────────────────────────────
      # 단일 head 만으로는 "체인은 하나인데 모델과 어긋난 상태" 를 못 잡는다.
      # SQLite 에 실제로 적용한 뒤 autogenerate 가 할 일이 없는지 확인한다 —
      # migration 과 모델 metadata 가 어긋나면 여기서 걸린다.
      - name: alembic 적용 + 드리프트 검사
        env:
          ALEMBIC_DATABASE_URL: sqlite:///./ci_schema_check.sqlite3
        run: |
          rm -f ci_schema_check.sqlite3
          uv run alembic upgrade head
          uv run alembic check
          rm -f ci_schema_check.sqlite3

      - name: 검수 임시 경로 정리
        if: always()
        run: rm -rf "${GATE_TMP}"
